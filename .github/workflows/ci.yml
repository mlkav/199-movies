name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Install lcov and dependencies, then run tests
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          chmod +x ./test.sh
          export PATH="$FLUTTER_ROOT/bin:$PATH"
          ./test.sh || true

      - name: Check code coverage threshold (>95%)
        run: |
          python3 -c "
          import sys
          with open('coverage/test.info') as f:
              lines = f.readlines()
          total = 0
          hit = 0
          for line in lines:
              if line.startswith('DA:'):
                  parts = line.strip().split(',')
                  total += 1
                  if int(parts[1]) > 0:
                      hit += 1
          coverage = (hit / total) * 100 if total > 0 else 0
          print(f'Total lines: {total}, Hit lines: {hit}, Coverage: {coverage:.2f}%')
          if coverage < 95.0:
              print('Coverage is below 95% threshold!')
              sys.exit(1)
          else:
              print('Coverage threshold check (>95%) PASSED!')
          "

      - name: Create .env file from Secrets
        run: |
          echo "API_KEY=${{ secrets.TMDB_API_KEY }}" >> .env
          echo "BASE_URL=https://api.themoviedb.org/3/" >> .env
          echo "BASE_IMAGE_URL=https://image.tmdb.org/t/p/w500/" >> .env

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk