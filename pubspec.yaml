name: ditonton
description: A new Flutter application.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  core:
    path: ./core
  movie:
    path: ./movie
  tv:
    path: ./tv

  http: ^1.2.2
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  dartz: ^0.10.1
  equatable: ^2.0.5
  google_fonts: ^6.2.1
  flutter_rating_bar: ^4.0.1
  cached_network_image: ^3.4.1
  get_it: ^7.7.0
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  flutter_dotenv: ^5.1.0
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3

dev_dependencies:
  mockito: ^5.0.8
  bloc_test: ^9.1.7
  build_runner: ^2.0.4
  flutter_lints: ^2.0.0
  sqflite_common_ffi: ^2.3.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/certificates/
    - .env
